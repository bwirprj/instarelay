<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Instagram Scheduler{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="{{ url_for('dashboard') }}">IG Scheduler</a>
      <nav>
        <a href="{{ url_for('dashboard_posts') }}">Posts</a>
        <a href="{{ url_for('dashboard_api_keys') }}">API Keys</a>
        <a href="{{ url_for('health') }}">Health</a>
      </nav>
    </header>
    <main class="container">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
